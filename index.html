<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f4f1e8'/%3E%3Cpath d='M15 26v-8' stroke='%236b4a24' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='15' cy='11' r='7' fill='%232f6b2e'/%3E%3C/svg%3E" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شجرة العائلة</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:24px;font:16px system-ui">
        هذه الصفحة تحتاج جافاسكربت. افتح الملف من متصفح (Safari أو Chrome) وليس من المعاينة.
      </p>
    </noscript>
    <p id="boot" style="padding:24px;font:16px system-ui;line-height:1.6">
      جارٍ فتح الشجرة… إن بقيت هذه الرسالة، افتح الملف داخل Safari أو Chrome مباشرة.
    </p>
    <script>
      window.addEventListener('error', function (e) {
        var b = document.getElementById('boot');
        if (b) b.textContent = 'تعذر تشغيل الصفحة على هذا المتصفح: ' + (e.message || '');
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
